# Compile l'application pour macOS (Apple Silicon) et Windows.
# - Push d'un tag "v*" (ex : v1.0.0) -> compilation + Release GitHub avec les deux fichiers.
# - Lancement manuel (onglet Actions -> "Run workflow") -> compilation seule, fichiers dans "Artifacts".
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (arm64)
            artifact: MesFinances-macOS-AppleSilicon.zip
          - os: windows-latest
            artifact: MesFinances-Windows.exe
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Installer les dépendances
        run: pip install -r requirements-build.txt

      - name: Compiler
        run: pyinstaller --noconfirm --clean mes_finances.spec

      - name: Empaqueter (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Mes Finances.app" "${{ matrix.artifact }}"

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "dist/Mes Finances.exe" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Mes Finances ${{ github.ref_name }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --generate-notes
